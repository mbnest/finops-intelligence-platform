# Generation rules for the demo dataset.
# Every value the generated data depends on is declared here; generate.py only applies these rules.
# All names (verticals, applications, accounts, people) are fictional.

seed: 20260917
billing_periods: ["2026-04", "2026-05", "2026-06"]
currency: USD

# Negotiated discount off list price, per provider: contracted_unit_price = list_unit_price * (1 - discount).
providers:
  aws:
    name: AWS
    billing_account: aws-payer-001
    negotiated_discount: 0.06
    region: us-east-1
  azure:
    name: Microsoft
    billing_account: az-ea-001
    negotiated_discount: 0.08
    region: eastus
  gcp:
    name: Google Cloud
    billing_account: gcp-ba-001
    negotiated_discount: 0.04
    region: us-central1

# Service codes used by resources below, mapped to FOCUS ServiceName, ServiceCategory, and PricingUnit.
services:
  aws:
    ec2: {name: Amazon Elastic Compute Cloud, category: Compute, unit: Hours}
    rds: {name: Amazon Relational Database Service, category: Databases, unit: Hours}
    s3: {name: Amazon Simple Storage Service, category: Storage, unit: GB-Day}
    support: {name: AWS Support (Enterprise), category: Management and Governance, unit: Month}
  azure:
    vm: {name: Virtual Machines, category: Compute, unit: Hours}
    sql: {name: SQL Database, category: Databases, unit: Hours}
    storage: {name: Storage, category: Storage, unit: GB-Day}
  gcp:
    compute: {name: Compute Engine, category: Compute, unit: Hours}
    cloudsql: {name: Cloud SQL, category: Databases, unit: Hours}
    gcs: {name: Cloud Storage, category: Storage, unit: GB-Day}

verticals:
  - {vertical_id: advisory, vertical_name: Retail, cost_center: CC-100}
  - {vertical_id: workplace, vertical_name: Logistics, cost_center: CC-200}
  - {vertical_id: investments, vertical_name: Finance Systems, cost_center: CC-300}
  - {vertical_id: project_mgmt, vertical_name: Project Management, cost_center: CC-400}
  - {vertical_id: corporate, vertical_name: Corporate Technology, cost_center: CC-900}

# Sub-accounts (AWS accounts, Azure subscriptions, GCP projects). The account decides the vertical.
accounts:
  - {account_id: aws-111111111111, provider: aws, account_name: advisory-prod, vertical_id: advisory}
  - {account_id: aws-222222222222, provider: aws, account_name: workplace-prod, vertical_id: workplace}
  - {account_id: aws-333333333333, provider: aws, account_name: corporate-data, vertical_id: corporate}
  - {account_id: az-sub-investments, provider: azure, account_name: investments, vertical_id: investments}
  - {account_id: az-sub-projects, provider: azure, account_name: projects, vertical_id: project_mgmt}
  - {account_id: az-sub-corporate, provider: azure, account_name: corporate, vertical_id: corporate}
  - {account_id: gcp-proj-workplace, provider: gcp, account_name: workplace-ops, vertical_id: workplace}
  - {account_id: gcp-proj-analytics, provider: gcp, account_name: portfolio-analytics, vertical_id: investments}

# APM applications. Owner and secondary approver are the contract signers in step 4.
applications:
  - {apm_id: APM-1001, name: Order Pipeline, vertical_id: advisory, owner: owner.1001@example.com, secondary_approver: approver.1001@example.com}
  - {apm_id: APM-1002, name: Pricing Engine, vertical_id: advisory, owner: owner.1002@example.com, secondary_approver: approver.1002@example.com}
  - {apm_id: APM-1003, name: Support Portal, vertical_id: workplace, owner: owner.1003@example.com, secondary_approver: approver.1003@example.com}
  - {apm_id: APM-1004, name: Dispatch Service, vertical_id: workplace, owner: owner.1004@example.com, secondary_approver: approver.1004@example.com}
  - {apm_id: APM-1005, name: Usage Analytics, vertical_id: investments, owner: owner.1005@example.com, secondary_approver: approver.1005@example.com}
  - {apm_id: APM-1006, name: Financial Reporting, vertical_id: investments, owner: owner.1006@example.com, secondary_approver: approver.1006@example.com}
  - {apm_id: APM-1007, name: Project Tracker, vertical_id: project_mgmt, owner: owner.1007@example.com, secondary_approver: approver.1007@example.com}
  - {apm_id: APM-1008, name: Cost Estimator, vertical_id: project_mgmt, owner: owner.1008@example.com, secondary_approver: approver.1008@example.com}
