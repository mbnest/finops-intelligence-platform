# Account-level charges with no resource_id, on the first day of each billing period.
account_charges:
  - {provider: aws, account_id: aws-111111111111, service: support, sku: enterprise-support, amount: 1500.0}

# No-upfront commitments. Each day, a purchase row bills daily_commitment. The commitment covers the listed
# resources in order, up to daily_commitment / (1 - discount) of contracted cost, at that discount.
# Coverage it can't use that day becomes an Unused row.
# Sizing: the AWS savings plan covers about 74% of its eligible cost and is always fully used.
# The Azure reservation is fully used until az-vm-projecttracker-web ends on 2026-05-15, then partly unused.
commitments:
  - commitment_discount_id: sp-aws-compute-001
    provider: aws
    commitment_type: Savings Plan
    scope: Compute
    term_months: 36
    payment_option: No Upfront
    discount: 0.28
    daily_commitment: 252.0
    start_date: "2025-10-01"
    end_date: "2028-09-30"
    covers: [aws-ec2-deal-api, aws-ec2-valuation-workers, aws-ec2-facilities-web]
  - commitment_discount_id: ri-az-vm-001
    provider: azure
    commitment_type: Reservation
    scope: Shared
    term_months: 12
    payment_option: Monthly
    discount: 0.35
    daily_commitment: 90.0
    start_date: "2025-12-01"
    end_date: "2026-11-30"
    covers: [az-vm-fund-reporting-app, az-vm-projecttracker-web, az-vm-identityhub]

# Restatements: a later delivery for a billing period that changes prices. Every other period has one delivery.
# Delivery 2 re-sends the whole period; only the listed service's contracted price changes (list price does not).
restatements:
  - {provider: azure, billing_period: "2026-05", delivery: 2, service: sql, contracted_price_factor: 0.90, reason: Rate correction to negotiated SQL Database pricing}

# Injected anomalies, applied to a resource's daily qty. Written to ground_truth/anomalies.csv.
#   spike: qty * factor for duration_days, then back to normal
#   step:  qty * factor from start to the end of the range
#   ramp:  qty * (1 + daily_increase * n) for n = 1..duration_days, then holds the last level
anomalies:
  - {anomaly_id: GT-001, kind: spike, resource_id: aws-ec2-datalake-etl, start: "2026-05-12", duration_days: 1, factor: 6.0}
  - {anomaly_id: GT-002, kind: step, resource_id: az-sql-costestimator-db, start: "2026-06-03", factor: 1.8}
  - {anomaly_id: GT-003, kind: ramp, resource_id: gcp-gce-workorder-workers, start: "2026-05-20", duration_days: 25, daily_increase: 0.04}

# Expected changes: real cost changes that are not anomalies. Also written to ground truth, labeled is_anomaly false,
# so the eval gate can count them as false positives if flagged.
expected_changes:
  - {change_id: EC-001, kind: new_resource, resource_id: gcp-gce-portfolio-ml-training, start: "2026-06-01"}
  - {change_id: EC-002, kind: removed_resource, resource_id: az-vm-projecttracker-web, start: "2026-05-16"}

# Daily CPU utilization: cpu from each resource, plus normal noise with this standard deviation, clipped to 0-100.
utilization:
  cpu_noise: 1.0

# Automation contracts (step 4). Applications not listed have no contract and stay advisory.
contracts:
  - {apm_id: APM-1003, allowed_max_tier: LOW, execution_mode: live, status: active}
  - {apm_id: APM-1007, allowed_max_tier: LOW, execution_mode: dry_run, status: active}
  # Signed for the full tier range, so a HIGH-tier action on its production resources reaches an
  # approver instead of stopping at advisory.
  - {apm_id: APM-1002, allowed_max_tier: FULL, execution_mode: live, status: active}
