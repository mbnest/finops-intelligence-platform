  - {resource_id: az-vm-projecttracker-web, account_id: az-sub-projects, apm_id: APM-1007, environment: prod, service: vm, sku: D4s_v5, list_price: 0.192, qty: 144, noise: 0.02, cpu: 35, end: "2026-05-15"}
