  - {resource_id: aws-ec2-untagged-01, account_id: aws-333333333333, apm_id: null, environment: null, service: ec2, sku: t3.large, list_price: 0.0832, qty: 24, noise: 0.01, cpu: 12}
  # Azure
  - {resource_id: az-vm-fund-reporting-app, account_id: az-sub-investments, apm_id: APM-1006, environment: prod, service: vm, sku: E8s_v5, list_price: 0.504, qty: 240, noise: 0.03, cpu: 50}
  - {resource_id: az-sql-fund-reporting-db, account_id: az-sub-investments, apm_id: APM-1006, environment: prod, service: sql, sku: GP_Gen5_4, list_price: 0.73, qty: 24, noise: 0.01}
